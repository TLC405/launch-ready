name: Build and publish TLC Prime Android APK
on:
  push:
    branches: [tlc-prime-apk-build]
    paths:
      - "tlc-prime-android/**"
      - ".github/workflows/tlc-prime-apk.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK 35
        run: |
          SDKM=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)
          test -x "$SDKM"
          "$SDKM" --install 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build Android release APK
        run: gradle -p tlc-prime-android --no-daemon :app:assembleRelease
      - name: Sign and verify APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          keytool -genkeypair -noprompt -keystore release/tlc-prime-keystore.jks -storepass "${{ github.run_id }}" -keypass "${{ github.run_id }}" -alias tlcprime -keyalg RSA -keysize 3072 -validity 10000 -dname "CN=TLC Prime,OU=TLC,O=TLC,L=Oklahoma City,ST=Oklahoma,C=US"
          APK="tlc-prime-android/app/build/outputs/apk/release/app-release-unsigned.apk"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -f -p 4 "$APK" "release/tlc-prime-aligned.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign --ks release/tlc-prime-keystore.jks --ks-key-alias tlcprime --ks-pass "pass:${{ github.run_id }}" --key-pass "pass:${{ github.run_id }}" --out release/TLC-Prime-Kame-House.apk release/tlc-prime-aligned.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs release/TLC-Prime-Kame-House.apk
          unzip -t release/TLC-Prime-Kame-House.apk
          sha256sum release/TLC-Prime-Kame-House.apk > release/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: TLC-Prime-Kame-House-APK
          path: |
            release/TLC-Prime-Kame-House.apk
            release/SHA256SUMS.txt
      - name: Publish installable release asset
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release delete tlc-prime-android-v3.8 --yes --cleanup-tag 2>/dev/null || true
          gh release create tlc-prime-android-v3.8 release/TLC-Prime-Kame-House.apk release/SHA256SUMS.txt --title "TLC Prime Kame House Android 3.8" --notes "Android installation package with original offline training app, progress tracking and native video sharing. AI analysis requires a connection in this build. Signed with a new key; back up old progress before reinstalling." --target "${{ github.sha }}"
